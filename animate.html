<HTML>
<HEAD>
<TITLE>animate</TITLE>
<link rel="stylesheet" href="animate.css">
</HEAD>
<BODY bgcolor=black>
<IMG id='logo' src="images/11.png"></IMG>
<IMG id='logo2' src="images/22.png"></IMG>
<DIV id='up' onclick="document.getElementById('logo').style.top='5%'; document.getElementById('logo2').style.top='85%';"></DIV>
<DIV id='down' onclick="document.getElementById('logo').style.top='85%'; document.getElementById('logo2').style.top='5%';"></DIV>
<DIV id='left' onclick="document.getElementById('logo').style.left='5%';document.getElementById('logo2').style.left='85%';"></DIV>
<DIV id='right' onclick="document.getElementById('logo').style.left='85%';document.getElementById('logo2').style.left='5%';"></DIV>
</BODY>
</HTML>
